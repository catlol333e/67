<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>67</title>
    
    <!-- Force Cache Invalidation for Favicon Asset -->
    <link rel="icon" type="image/png" href="favicon.png?v=1">

    <!-- Open Graph (OG) Meta Tags for Social Media Preview Cards -->
    <meta property="og:title" content="67">
    <meta property="og:type" content="website">
    <meta property="og:description" content="Experience the 67 project canvas. Interactive Sakura pink layout with immersive audio feedback.">
    <meta property="og:image" content="favicon.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="194">
    <meta property="og:image:height" content="194">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="67">
    <meta name="twitter:description" content="Experience the 67 project canvas.">
    <meta name="twitter:image" content="favicon.png">

    <!-- Loading a beautiful, heavy, clean-cut modern font -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2 family=Montserrat:wght=900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            /* Semi-transparent Light Cyan layer over solid black baseline */
            background: linear-gradient(rgba(224, 255, 255, 0.35), rgba(224, 255, 255, 0.35)), #000;
            overflow: hidden;
            font-family: 'Montserrat', 'Arial Black', sans-serif;
            position: relative;
        }

        /* Repeating background pattern setup using Sakura Pink */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.35;
            color: #ffb7c5; /* Sakura Pink */
            font-size: clamp(12px, 1.2vw, 20px);
            line-height: 1.1;
            word-break: break-all;
            user-select: none;
            pointer-events: none; /* Clicks fall through to interactive element */
            padding: 10px;
            letter-spacing: 1px;
        }

        /* Centered interactive 67 element */
        .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            cursor: pointer;
            user-select: none;
            color: #ffb7c5; /* Sakura Pink */
            opacity: 1;
            text-align: center;
            line-height: 1;
            font-size: clamp(60px, 10vw, 180px); 
            
            /* Professional thick solid outline using Sakura Pink */
            -webkit-text-stroke: 14px #ffb7c5;
            paint-order: stroke fill;
            
            transform: translate(-50%, -50%) scale(1);
            will-change: transform;
            display: none; /* Hidden until audio prompt is accepted */
        }

        /* Animation logic: Instant scale up, smooth slow scale down */
        .pulse-animation {
            animation: instantUpSlowDown 1.3s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }

        @keyframes instantUpSlowDown {
            0% {
                transform: translate(-50%, -50%) scale(1);
                filter: drop-shadow(0 0 0px rgba(255, 183, 197, 0));
            }
            1% {
                transform: translate(-50%, -50%) scale(1.5); /* Instant scale up */
                filter: drop-shadow(0 0 25px #ffb7c5) drop-shadow(0 0 50px #ffb7c5); /* Soft Sakura neon flash */
            }
            100% {
                transform: translate(-50%, -50%) scale(1); /* Slow return to normal */
                filter: drop-shadow(0 0 0px rgba(255, 183, 197, 0));\}
        }

        /* Immersive Audio Permission Modal overlay */
        .audio-prompt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .audio-prompt-btn {
            background: transparent;
            color: #ffb7c5;
            border: 4px solid #ffb7c5;
            padding: 20px 40px;
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(255, 183, 197, 0.4);
            transition: all 0.2s ease;
        }

        .audio-prompt-btn:hover {
            background: #ffb7c5;
            color: #000;
            box-shadow: 0 0 30px #ffb7c5;
        }
    </style>
</head>
<body>

    <!-- Audio Permission Gate Overlay -->
    <div class="audio-prompt-overlay" id="promptOverlay">
        <button class="audio-prompt-btn" id="startBtn">Enable Sound & Enter</button>
    </div>

    <div class="bg-overlay" id="bg"></div>
    <div class="center-text" id="target67">67</div>

    <!-- Linked directly to your uploaded faaah.mp3 audio file -->
    <audio id="audio67" src="faaah.mp3" preload="auto"></audio>

    <script>
        const target = document.getElementById('target67');
        const bg = document.getElementById('bg');
        const audio = document.getElementById('audio67');
        const promptOverlay = document.getElementById('promptOverlay');
        const startBtn = document.getElementById('startBtn');

        /* Generates matrix pattern to fill layout viewpoint cleanly */
        function fillBackground() {
            const pattern = "67".repeat(5000);
            bg.textContent = pattern;
        }
        
        fillBackground();

        /* Audio unlocking overlay interaction logic */
        startBtn.addEventListener('click', () => {
            // Safe initialization trigger context for modern media context engines
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
            }).catch(err => console.log("Audio pipeline initialized via user handler."));

            // Animate away modal wrapper and expose main interactive node
            promptOverlay.style.opacity = '0';
            setTimeout(() => {
                promptOverlay.style.display = 'none';
                target.style.display = 'block';
            }, 500);
        });

        /* Native pointer interactions */
        target.addEventListener('click', (e) => {
            e.stopPropagation(); 
            
            /* Immediate media reset to enable fast playback triggers */
            audio.currentTime = 0;
            audio.play().catch(err => console.log("Media resource faaah.mp3 not found or interaction blocked.", err));

            /* Class cycling mechanism to override transition cycles cleanly */
            target.classList.remove('pulse-animation');
            void target.offsetWidth; /* Trigger DOM reflow to restart animation instantly */
            target.classList.add('pulse-animation');
        });

        window.addEventListener('resize', fillBackground);
    </script>
</body>
</html>
