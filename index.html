<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>67</title>
    
    <!-- Link to the favicon asset -->
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            /* Semi-transparent Light Cyan layer over solid black baseline */
            background: linear-gradient(rgba(224, 255, 255, 0.35), rgba(224, 255, 255, 0.35)), #000;
            overflow: hidden;
            font-family: 'Arial Black', Impact, sans-serif;
            position: relative;
        }

        /* Repeating background pattern setup */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.35;
            color: #ff69b4;
            font-size: clamp(14px, 1.5vw, 24px);
            line-height: 1.2;
            word-break: break-all;
            user-select: none;
            pointer-events: none; /* Clicks fall through to interactive element */
            padding: 10px;
        }

        /* Centered interactive 67 element */
        .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            cursor: pointer;
            user-select: none;
            color: #ff69b4;
            opacity: 1;
            text-align: center;
            line-height: 1;
            font-size: clamp(120px, 18vw, 400px); 
            
            /* 14 specific layers of contrasting text-contouring */
            --base-shadow: 
                0 0 0 #fff,
                2px 2px 0px #ff1493, -2px -2px 0px #ff1493, 2px -2px 0px #ff1493, -2px 2px 0px #ff1493,
                4px 4px 0px #000, -4px -4px 0px #000, 4px -4px 0px #000, -4px 4px 0px #000,
                6px 6px 0px #ff69b4, -6px -6px 0px #ff69b4, 6px -6px 0px #ff69b4, -6px 6px 0px #ff69b4,
                8px 8px 0px #000, -8px -8px 0px #000, 8px -8px 0px #000, -8px 8px 0px #000,
                10px 10px 0px #ff1493, -10px -10px 0px #ff1493, 10px -10px 0px #ff1493, -10px 10px 0px #ff1493,
                12px 12px 0px #000, -12px -12px 0px #000, 12px -12px 0px #000, -12px 12px 0px #000,
                14px 14px 0px #ff69b4, -14px -14px 0px #ff69b4, 14px -14px 0px #ff69b4, -14px 14px 0px #ff69b4;

            text-shadow: var(--base-shadow);
            transform: translate(-50%, -50%) scale(1);
            will-change: transform, text-shadow; /* HW optimization for responsive canvas */
        }

        /* Combined micro-interaction animation */
        .pulse-animation {
            animation: instantUpSlowDown 1.3s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }

        @keyframes instantUpSlowDown {
            0% {
                transform: translate(-50%, -50%) scale(1);
                text-shadow: var(--base-shadow);
            }
            1% {
                transform: translate(-50%, -50%) scale(1.5);
                /* Radial neon dispersion mapped underneath text shadows */
                text-shadow: 
                    var(--base-shadow),
                    0 0 20px #ff1493,
                    0 0 40px #ff69b4,
                    0 0 80px #ff69b4,
                    0 0 120px #ff1493;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                text-shadow: var(--base-shadow);
            }
        }
    </style>
</head>
<body>

    <div class="bg-overlay" id="bg"></div>
    <div class="center-text" id="target67">67</div>

    <audio id="audio67" src="67.mp3" preload="auto"></audio>

    <script>
        const target = document.getElementById('target67');
        const bg = document.getElementById('bg');
      // Dynamically compute layout scale matrix to cover wide desktop viewpoints
        function fillBackground() {
            const pattern = "67".repeat(4000);
            bg.textContent = pattern;
        }
        
        fillBackground();

        // Native pointer interactions
        target.addEventListener('click', (e) => {
            e.stopPropagation(); 
            
            // Immediate media reset to enable fast playback triggers
            audio.currentTime = 0;
            audio.play().catch(err => console.log("Media resource 67.mp3 not found or interaction blocked.", err));

            // Class cycling mechanism to override transition cycles
            target.classList.remove('pulse-animation');
            void target.offsetWidth; 
            target.classList.add('pulse-animation');
        });

        window.addEventListener('resize', fillBackground);
    </script>
</body>
</html>
        const audio = document.getElementById('audio67');
